version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: animanga_postgres
    environment:
      POSTGRES_USER: animanga_admin
      POSTGRES_PASSWORD: secure_password_here
      POSTGRES_DB: animanga_ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: animanga_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
